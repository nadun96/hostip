[package]
name = "hostip"
version = "0.1.0"
edition = "2024"
description = "Publish local apps on your public IP over HTTPS, with Let's Encrypt IP certificates"
repository = "https://github.com/nadun96/hostip"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
argon2 = "0.6.0"
base64 = "0.22"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crab_nat = "0.8.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1", "http2"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "webpki-roots", "http1", "tls12"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
igd-next = { version = "0.18.0", default-features = false, features = ["aio_tokio"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "time"] }
ipnet = { version = "2.12.2", features = ["serde"] }
netdev = "0.46.3"
qrcode = { version = "0.14.1", default-features = false }
rcgen = "0.14.10"
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full", "test-util"] }

[[bench]]
name = "e2e"
harness = false

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
