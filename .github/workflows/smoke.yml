name: Smoke

# End-to-end smoke tests of the release binary with the data in tests/smoke.
# The pipeline's test stage calls this; pull requests that change the smoke
# tests or the pipeline run it too, so they are checked before reaching test.
on:
  workflow_call:
  pull_request:
    paths:
      - "tests/smoke/**"
      - ".github/workflows/smoke.yml"
      - ".github/workflows/pipeline.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cargo build --release
      - name: Smoke test with tests/smoke data
        shell: bash
        run: tests/smoke/run.sh "target/release/hostip$([ "$RUNNER_OS" = Windows ] && echo .exe || true)"
