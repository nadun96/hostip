name: Release

# Builds binaries for every platform and attaches them to a GitHub release,
# created as a draft so it can be reviewed before publishing. Start it either by
# pushing a tag like v0.2.0, or with "Run workflow" on main (Actions -> Release),
# which creates the tag itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.2.0 (must match Cargo.toml)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release only from main, with the version in Cargo.toml
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run the release from main, not $GITHUB_REF_NAME"; exit 1
          fi
          cargo_version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$VERSION" != "$cargo_version" ]; then
            echo "::error::version $VERSION does not match Cargo.toml ($cargo_version)"; exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="hostip-${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE examples/hostip.toml "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/hostip.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "target/${{ matrix.target }}/release/hostip" "$name/"
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: hostip-*.${{ matrix.archive }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # From "Run workflow" this creates the tag on the commit that was built.
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: hostip-*
