name: CI

# Checks every pull request and feature-branch push. The promotion pipeline
# (pipeline.yml) reuses it for the dev stage.
on:
  pull_request:
  push:
    branches-ignore: [dev, test, main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Pebble (ACME test CA)
        if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - if: runner.os == 'Linux'
        run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
